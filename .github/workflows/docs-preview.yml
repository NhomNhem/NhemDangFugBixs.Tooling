name: Docs Preview Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and deploy (default: main)'
        required: false
        default: 'main'

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('Source~/nhemdangfugbixs-tooling-docs/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Source~/nhemdangfugbixs-tooling-docs

      - name: Build Astro docs site
        run: pnpm run build
        working-directory: Source~/nhemdangfugbixs-tooling-docs

      - name: Verify build
        run: test -d Source~/nhemdangfugbixs-tooling-docs/dist

      - name: Deploy preview to gh-pages-preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Source~/nhemdangfugbixs-tooling-docs/dist
          publish_branch: gh-pages-preview
          force_orphan: true
