name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - develop

jobs:
  dotnet:
    name: .NET Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Source~/NhemDangFugBixs.Tooling.sln

      - name: Build
        run: dotnet build Source~/NhemDangFugBixs.Tooling.sln -c Release --no-restore

      - name: Test
        run: dotnet test Source~/NhemDangFugBixs.Tooling.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
