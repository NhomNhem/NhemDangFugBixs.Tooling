name: Deploy UPM Branch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  deploy:
    name: Build deploy branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Prepare deploy directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy

          cp package.json deploy/
          cp README.md deploy/
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md deploy/
          else
            echo "# Changelog" > deploy/CHANGELOG.md
            echo "" >> deploy/CHANGELOG.md
            echo "Release notes are tracked via GitHub Releases." >> deploy/CHANGELOG.md
          fi

          if [ -f LICENSE.md ]; then cp LICENSE.md deploy/; fi
          if [ -f LICENSE ]; then cp LICENSE deploy/; fi
          if [ -f "Third Party Notices.md" ]; then cp "Third Party Notices.md" deploy/; fi

          if [ -d Runtime ]; then cp -R Runtime deploy/; fi
          if [ -d Editor ]; then cp -R Editor deploy/; fi
          if [ -d Analyzers ]; then cp -R Analyzers deploy/; fi
          if [ -d Tests ]; then cp -R Tests deploy/; fi
          if [ -d Samples ]; then cp -R Samples deploy/; fi
          if [ -d Documentation ]; then cp -R Documentation deploy/; fi
          if [ -d Samples~ ]; then cp -R Samples~ deploy/Samples; fi
          if [ -d Documentation~ ]; then cp -R Documentation~ deploy/Documentation; fi
          rm -rf deploy/Samples~ deploy/Documentation~

          # Remove AI/dev-only artifacts from deploy branch.
          rm -rf deploy/openspec deploy/.agent deploy/.codex deploy/.github deploy/scripts deploy/Source~ deploy/.githooks || true
          rm -f deploy/AGENTS.md deploy/QWEN.md deploy/GEMINI.md deploy/.openspec.yaml deploy/CONTRIBUTING.md || true

          # Hard whitelist validation for package branch.
          for required in package.json README.md CHANGELOG.md Runtime Editor Analyzers; do
            test -e "deploy/$required"
          done

          # Ensure deploy output is clean from AI/dev artifacts.
          test ! -e deploy/openspec
          test ! -e deploy/.agent
          test ! -e deploy/.codex
          test ! -e deploy/Source~
          test ! -e deploy/AGENTS.md

      - name: Publish deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./deploy
          force_orphan: true
