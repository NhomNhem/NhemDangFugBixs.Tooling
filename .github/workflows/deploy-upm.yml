name: Deploy UPM Branch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  deploy:
    name: Build deploy branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Prepare deploy directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy

           copy_file_if_exists() {
             if [ -f "$1" ]; then
               cp "$1" "$2"
             fi
           }

           copy_dir_if_exists() {
             if [ -d "$1" ]; then
               cp -R "$1" "$2"
             fi
           }

           copy_dir_if_exists Runtime deploy/
           copy_file_if_exists Runtime.meta deploy/
           copy_dir_if_exists Editor deploy/
           copy_file_if_exists Editor.meta deploy/
           copy_dir_if_exists Analyzers deploy/
           copy_file_if_exists Analyzers.meta deploy/
           mkdir -p deploy/docs
           copy_dir_if_exists docs/assets deploy/docs/
           copy_file_if_exists docs.meta deploy/
           copy_dir_if_exists Assets deploy/
           copy_file_if_exists Assets.meta deploy/

           copy_file_if_exists package.json deploy/
           copy_file_if_exists package.json.meta deploy/
           copy_file_if_exists README.md deploy/
           copy_file_if_exists README.md.meta deploy/
           copy_file_if_exists CHANGELOG.md deploy/
           copy_file_if_exists CHANGELOG.md.meta deploy/
           copy_file_if_exists LICENSE.md deploy/
           copy_file_if_exists LICENSE.md.meta deploy/
           copy_file_if_exists LICENSE deploy/
           copy_file_if_exists LICENSE.meta deploy/
           copy_file_if_exists "Third Party Notices.md" deploy/
           copy_file_if_exists "Third Party Notices.md.meta" deploy/

           # Remove AI/dev-only artifacts from deploy branch.
           rm -rf deploy/openspec deploy/.agent deploy/.codex deploy/.github deploy/scripts deploy/Source~ deploy/.githooks || true
           rm -f deploy/AGENTS.md deploy/QWEN.md deploy/GEMINI.md deploy/.openspec.yaml deploy/CONTRIBUTING.md || true

           # Hard whitelist validation for package branch.
           for required in package.json README.md CHANGELOG.md Runtime Editor Analyzers docs/assets; do
             test -e "deploy/$required"
           done

           # Ensure deploy output is clean from AI/dev artifacts.
           test ! -e deploy/openspec
           test ! -e deploy/.agent
           test ! -e deploy/.codex
           test ! -e deploy/Source~
           test ! -e deploy/AGENTS.md

      - name: Publish deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./deploy
          force_orphan: true
