name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Source~/NhemDangFugBixs.Tooling.sln -c Release

      - name: Test
        run: dotnet test Source~/NhemDangFugBixs.Tooling.sln -c Release --no-build

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          zip -r artifacts/NhemDangFugBixs.Tooling-${GITHUB_REF_NAME}.zip \
            package.json README.md CHANGELOG.md Runtime Editor Analyzers Documentation~ Samples~ Tests \
            -x '*.git*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
